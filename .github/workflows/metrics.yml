name: Metrics

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "metrics.svg"
      - "README.md"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Quantum-Quasar
          filename: metrics.svg
          template: classic
          config_timezone: Asia/Kolkata
          config_twemoji: yes
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh metrics.svg [skip ci]"
          commits_authoring: shaurya, shauryakad2@gmail.com, Quantum-Quasar
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 100
          repositories_forks: yes
          plugin_calendar: yes
          plugin_calendar_limit: 0
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_repositories: yes
          plugin_repositories_featured: Quantum-Quasar/brucke, Quantum-Quasar/tines
